plugins {
   id 'net.fabricmc.fabric-loom-remap' version "${loom_version}"
    id 'maven-publish'
}

base {
    archivesName = project.archives_base_name
}
version = project.mod_version + "-" + project.minecraft_version
group = project.maven_group

repositories {
    exclusiveContent {
        forRepository { maven { url = "https://maven.shedaniel.me/" } }
        filter { includeGroupAndSubgroups "me.shedaniel"; includeGroup "dev.architectury" }
    }
    exclusiveContent {
        forRepository { maven { url = "https://maven.terraformersmc.com/" } }
        filter { includeGroup "com.terraformersmc" }
    }
    exclusiveContent {
        forRepository { maven { url = "https://api.modrinth.com/maven" } }
        filter { includeGroup "maven.modrinth" }
    }
    exclusiveContent {
        forRepository { maven { url = "https://maven.misterpemodder.com/libs-release/" } }
        filter { includeGroup "com.misterpemodder" }
    }
    exclusiveContent {
        forRepository { maven { url = "https://maven.ladysnake.org/releases" } }
        filter { includeGroupAndSubgroups "org.ladysnake" }
    }
}

dependencies {
    minecraft "com.mojang:minecraft:${project.minecraft_version}"
    mappings "net.fabricmc:yarn:${project.yarn_mappings}:v2"
    modImplementation "net.fabricmc:fabric-loader:${project.loader_version}"
    modImplementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_version}"

//    // config
//    modImplementation include ('com.github.Draylar.omega-config:omega-config-base:1.2.3-1.18.1') {
//        exclude group: "net.fabricmc.fabric-api"
//    }
    // Config
    modImplementation ("me.shedaniel.cloth:cloth-config-fabric:${project.cloth_config_version}") {
        exclude(group: "net.fabricmc.fabric-api")
    }
    // trinkets
    modCompileOnly "maven.modrinth:trinkets-canary:${trinkets_version}"
    modCompileOnly "org.ladysnake.cardinal-components-api:cardinal-components-base:${cca_version}"
    modCompileOnly "org.ladysnake.cardinal-components-api:cardinal-components-entity:${cca_version}"

    // shulker box tooltip
    modCompileOnly modRuntimeOnly("com.misterpemodder:shulkerboxtooltip-fabric:${project.shulker_box_tooltip_version}") {
        exclude group: "io.github.prospector"
        exclude group: "me.shedaniel.cloth"
        exclude group: "net.fabricmc.fabric-api"
    }
}

processResources {
    inputs.property "version", project.version

	filesMatching("fabric.mod.json") {
		expand "version": project.version, "fabric_version": project.fabric_version, "loader_version": project.loader_version, "minecraft_version": project.minecraft_version
	}
}

tasks.withType(JavaCompile).configureEach {
    it.options.release = 21
}

java {
    // Loom will automatically attach sourcesJar to a RemapSourcesJar task and to the "build" task
    // if it is present.
    // If you remove this line, sources will not be generated.
    withSourcesJar()
}

java {
    sourceCompatibility = JavaVersion.VERSION_21
    targetCompatibility = JavaVersion.VERSION_21
}

jar {
    from("LICENSE") {
        rename { "${it}_${project.archives_base_name}"}
    }
    from("LICENSE_inmisaddon")
}

// configure the maven publication
publishing {
    publications {
        mavenJava(MavenPublication) {
            // add all the jars that should be included when publishing to maven
            artifact(remapJar) {
                builtBy remapJar
            }
            artifact(sourcesJar) {
                builtBy remapSourcesJar
            }
        }
    }

    // select the repositories you want to publish to
    repositories {
        // uncomment to publish to the local maven
        // mavenLocal()
    }
}
